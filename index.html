<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root { --bg:#f6f7f9; --text:#1b2430; --muted:#5b6675; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    h1 { font-size: clamp(2.5rem, 9vw, 5rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    p  { margin: 0 0 28px; color: var(--muted); font-size: 1.1rem; }
    .env {
      display: inline-block; padding: 8px 18px; border-radius: 999px;
      font-weight: 600; color: #fff; background: var(--accent);
    }
    .env.development { background: #2563eb; }
    .env.staging     { background: #d97706; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>My first website on AWS Amplify.</p>
    <span id="env" class="env">loading...</span>
  </main>

  <script src="config.js"></script>
  <script>
    var badge = document.getElementById("env");
    var env = (window.APP_CONFIG && window.APP_CONFIG.environment) || "unknown";
    badge.textContent = "Environment: " + env;
    badge.className = "env " + env;
    document.title = "Hello World (" + env + ")";
  </script>
</body>
</html>
